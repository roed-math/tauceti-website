name: Pages

# Build and deploy the whole site: the main pages at /, the Atlas at /atlas/ and Tau Ceti Review at
# /review/. A repository has one Pages site, so the parts are assembled into one artifact, and the deploy
# waits for all of them: a failure leaves the last deployment up rather than a site with a part missing.
#
# Tau Ceti Review's app is served from review/web/, reading the data/ that the review data repository
# (vars.REVIEW_DATA_REPO) builds and publishes on its own Pages (vars.REVIEW_DATA_URL); its data grows
# with Tau Ceti, and this site's Pages could not hold it. The review job here tests the app against that
# repository's forms and scripts.
#
# Runs every three hours, half an hour after taucetiproject.org's own deploy (cron "23 */3"), so the
# live data the pages read is fresh.
on:
  push:
    branches: [main]
  schedule:
    - cron: "53 */3 * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      deploy:
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      # The previous run's data/, including the pull-request snapshot in data/cache/. A failed
      # source then keeps last run's file, and the walk only fetches what changed since.
      - name: Restore the previous data
        uses: actions/cache/restore@v4
        with:
          path: data
          key: site-data-${{ github.run_id }}
          restore-keys: site-data-

      # Full history: the line-count series sums every first-parent commit's numstat.
      - name: Clone TauCeti
        run: git clone --quiet https://github.com/TauCetiProject/TauCeti.git "$RUNNER_TEMP/TauCeti"

      - name: Generate data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/build_data.py --tauceti-repo "$RUNNER_TEMP/TauCeti" \
            || echo "::warning::some data sources failed; their previous files are kept"

      - name: Count theorems and definitions
        run: |
          python3 scripts/library_counts.py --tauceti-repo "$RUNNER_TEMP/TauCeti" \
            || echo "::warning::declaration counts failed; the previous file is kept"

      - name: Save the data for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: site-data-${{ github.run_id }}

      - name: Build the site
        env:
          REVIEW_DATA_URL: ${{ vars.REVIEW_DATA_URL }}
        run: python3 scripts/build_site.py --out _site

      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: site
          path: _site
          include-hidden-files: true
          retention-days: 2

  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The Atlas's data stays in cbirkbeck/tauceti-explorer; scripts/build_atlas.sh checks out the
      # part the build reads and lays atlas/'s code over it.
      - name: Build the Atlas
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/build_atlas.sh "$RUNNER_TEMP/atlas-data" _atlas
      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: atlas
          path: _atlas
          retention-days: 2

  # The review app's tests, against the review data repository's forms and scripts. Until that
  # repository exists, the review's existing repository has the same ones.
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: review
    env:
      TAU_REVIEW_DATA: ${{ github.workspace }}/review-data
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.REVIEW_DATA_REPO || 'cbirkbeck/tauceti-reviewed-by-test' }}
          path: review-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The pinned tools, and Chromium for the browser check
        run: |
          pip install -q -r requirements.txt -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: The browser check, on the fixture's site
        run: python tests/validate_site.py

  assemble:
    needs: [site, atlas, review]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - uses: actions/download-artifact@v4
        with:
          name: atlas
          path: _site/atlas
      - run: du -sh _site _site/atlas _site/review
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: assemble
    if: github.ref == 'refs/heads/main' && format('{0}', inputs.deploy) != 'false'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
