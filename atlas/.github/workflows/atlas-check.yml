name: Atlas check

# Runs the unit tests and both browser suites on the committed atlas, so that a
# change that breaks the page shows at once. The intake runs the same suites
# before it publishes promoted work (swarm-intake.yml).
on:
  push:
    branches: [main]
    paths: ['index.html', 'src/**', 'scripts/**', 'tests/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Browser suites
        shell: bash
        run: |
          python3 -m pip install -q playwright
          python3 -m playwright install --with-deps chromium > /dev/null
          python3 tests/validate_browser.py > "$RUNNER_TEMP/browser.log" 2>&1 || { tail -60 "$RUNNER_TEMP/browser.log"; exit 1; }
          python3 tests/validate_blueprints_browser.py
