name: Tau Ceti progress

# Four times a day, rebuild the published pages from Tau Ceti's own data: the Progress page of
# the Tau Ceti site (static/progress.json), for the state of each layer of its roadmaps, and the
# open pull requests to TauCetiRoadmap, for the roadmaps proposed to it (scripts/tauceti_prs.py).
# The atlas (index.html) shows both, since 2026-10-21 in place of the campaign's own planned
# roadmaps; the Tau Ceti atlas (tauceti/index.html) shows only Tau Ceti's. A roadmap Tau Ceti has
# accepted since the atlas's snapshot joins both maps from its README. Mathlib's disk round the sun
# follows the Mathlib commit Tau Ceti builds on, and is made again when that commit moves (below).
# Nothing is pushed unless the data changed and both pages pass their checks.

on:
  # GitHub starts scheduled runs on a best-effort basis and drops some (the 07:20 run on
  # 2026-09-29 never started). Four chances a day keep the page within hours of Tau Ceti's own.
  schedule:
    - cron: '20 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      mathlib:
        description: Make the Mathlib disk again even if Tau Ceti's Mathlib commit has not moved
        type: boolean
        default: false

# Its own group. It used to share the intake's, but a run waiting there was cancelled whenever
# another intake run queued, which the intake does all day: every scheduled run from 2026-10-09
# evening to 2026-10-11 morning was cancelled. A push that races the intake now rebuilds on top
# of it instead (the last step).
concurrency:
  group: tauceti-progress
  cancel-in-progress: false

permissions:
  contents: write
  issues: write  # the issue that says the scheduled update failed, and closes once one succeeds

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A run that makes the Mathlib disk again extracts Mathlib, about twenty-five minutes more.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch the Progress page's data and the proposed roadmaps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/tauceti_progress.py --fetch | tee -a "$GITHUB_STEP_SUMMARY"
          python3 scripts/tauceti_prs.py --fetch | tee -a "$GITHUB_STEP_SUMMARY"
      # Mathlib's disk follows the Mathlib commit in Tau Ceti's lake-manifest.json, and moves less often than the
      # roadmaps: when that commit has moved, Mathlib is extracted again and the disk made anew (about twenty-five
      # minutes); otherwise this takes a second. If it fails, the disk stays as it was and the rest is updated.
      - name: Mathlib's disk, when Tau Ceti's Mathlib has moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          force="${{ github.event_name == 'workflow_dispatch' && inputs.mathlib && '--force' || '' }}"
          if bash scripts/mathlib_refresh.sh "$RUNNER_TEMP/mathlib" $force > "$RUNNER_TEMP/mathlib.log" 2>&1; then
            tail -3 "$RUNNER_TEMP/mathlib.log" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            tail -30 "$RUNNER_TEMP/mathlib.log"
            git checkout -- data/mathlib-disk.json data/mathlib-pin.json
            echo "::warning::The Mathlib disk was not made again; it stays as it was." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # Kept apart, so that a retry below, which starts again from main, keeps the disk made here.
          mkdir -p "$RUNNER_TEMP/disk" && cp data/mathlib-disk.json data/mathlib-pin.json "$RUNNER_TEMP/disk/"
      - name: Rebuild, check and publish if it changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/tauceti-progress.json data/tauceti-new-roadmaps.json data/tauceti-prs.json data/mathlib-disk.json data/mathlib-pin.json; then echo "No change on the Progress page, in the pull requests or in Mathlib's disk." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          python3 scripts/build.py > /dev/null
          python3 scripts/build.py --tauceti > /dev/null
          # Only the tests of what builds the pages. The full suite also checks the swarm's live queue,
          # which is not this workflow's to fix and stalled the progress from 2026-10-11 (RS-01).
          python3 -m unittest tests/test_tauceti_progress.py tests/test_tauceti_prs.py tests/test_blueprints.py tests/test_decompositions.py \
            tests/test_definitions_page.py tests/test_galaxies.py tests/test_artefacts.py tests/test_library_coverage.py \
            tests/test_restructure.py tests/test_radial_layout.py tests/test_distances.py tests/test_items.py \
            tests/test_collation.py tests/test_merge_landmark_names.py tests/test_arxiv_groups.py tests/test_disk_layout.py tests/test_mathlib_areas.py
          python3 -m pip install -q playwright
          python3 -m playwright install --with-deps chromium > /dev/null
          python3 tests/validate_tauceti_browser.py > "$RUNNER_TEMP/tauceti.log" 2>&1 || { tail -40 "$RUNNER_TEMP/tauceti.log"; exit 1; }
          python3 tests/validate_browser.py > "$RUNNER_TEMP/browser.log" 2>&1 || python3 tests/validate_browser.py > "$RUNNER_TEMP/browser.log" 2>&1 || { tail -60 "$RUNNER_TEMP/browser.log"; exit 1; }
          for page in index.html tauceti/index.html; do
            python3 tests/validate_disk_browser.py "file://$PWD/$page" > "$RUNNER_TEMP/disk.log" 2>&1 || { tail -40 "$RUNNER_TEMP/disk.log"; exit 1; }
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          publish() {
            git add data/tauceti-progress.json data/tauceti-new-roadmaps.json data/tauceti-prs.json data/mathlib-disk.json data/mathlib-pin.json index.html definitions.html BUILD.json tauceti
            git commit -q -m "Atlas: Tau Ceti progress from the Progress page ($(python3 -c "import json; print(json.load(open('data/tauceti-progress.json'))['exported_at'])")) and its open pull requests"
          }
          publish
          for attempt in 1 2 3 4 5; do
            git push -q && exit 0
            # Someone pushed first, usually the intake, and both rebuild the same pages, so a rebase
            # would conflict. Start again from their main: fetch, rebuild, commit, push.
            sleep $((attempt * 15))
            git fetch -q origin main && git reset -q --hard origin/main
            python3 scripts/tauceti_progress.py --fetch > /dev/null && python3 scripts/tauceti_prs.py --fetch > /dev/null
            cp "$RUNNER_TEMP/disk/mathlib-disk.json" "$RUNNER_TEMP/disk/mathlib-pin.json" data/
            if git diff --quiet -- data/tauceti-progress.json data/tauceti-new-roadmaps.json data/tauceti-prs.json data/mathlib-disk.json data/mathlib-pin.json; then echo "Main already has this data."; exit 0; fi
            python3 scripts/build.py > /dev/null && python3 scripts/build.py --tauceti > /dev/null
            publish
          done
          exit 1
      # A failed update must not go unnoticed: from 2026-10-23 evening to 2026-10-25 every run failed a heading
      # check on the new roadmaps and nothing was published. A failed run opens (or adds to) one issue, which
      # GitHub mails to the repository's owner; the next run that succeeds closes it.
      - name: Say so when the update failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Atlas: the scheduled update failed"
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" -R "$GITHUB_REPOSITORY" --body "Failed again: $url"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "The atlas was not updated: $url (see its failed step). Nothing is published until a run succeeds."
          fi
      - name: Close the failure issue once an update succeeds
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Atlas: the scheduled update failed"
          for n in $(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[].number'); do
            gh issue close "$n" -R "$GITHUB_REPOSITORY" --comment "Updated again: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          done
